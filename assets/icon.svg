<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- dsh-memory-recall icon source. Rasterised to assets/icon.png (512x512)
       with: rsvg-convert -w 512 -h 512 -o assets/icon.png assets/icon.svg
       The solid brain the plugin draws in dsh (Phosphor "brain" fill, MIT —
       lib/client.js SolidBrainIcon), filled with the Saved-to-memory chip's
       own gradient (dmr-from, dmr-mid, dmr-to) and its violet glow (dmr-glow)
       on the chip's dark tile, so it reads at 36px (dsh's plugin list) and
       96px (the market tile) on light and dark. -->
  <defs>
    <linearGradient id="brain" x1="0" y1="0" x2="1" y2="0.28">
      <stop offset="0%" stop-color="#CE9A4B"/>
      <stop offset="48%" stop-color="#C08089"/>
      <stop offset="100%" stop-color="#A59ADC"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9E94D5" stop-opacity="0.22"/>
      <stop offset="70%" stop-color="#9E94D5" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#9E94D5" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="#1B1B1D"/>
  <circle cx="256" cy="256" r="230" fill="url(#glow)"/>
  <g transform="translate(86 86) scale(1.328)" fill="url(#brain)">
