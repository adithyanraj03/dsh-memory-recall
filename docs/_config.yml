# GitHub Pages configuration.
#
# Site: https://adithyanraj03.github.io/dsh-memory-recall/
# Deploy from a branch: main -> /docs — the site builds from index.md on
# every push.
#
# `theme:` must be one of the themes GitHub Pages supports natively:
# https://pages.github.com/themes/  — anything else needs a full Actions build.
title: dsh-memory-recall
description: >-
  Persistent memory for dsh in the style of Hermes Agent: a memory tool
  keeping a user profile and the model's own notes, delivered to every chat
  as a logged context message, plus session_search over earlier chats behind
  an approval prompt.
theme: jekyll-theme-cayman

# Shown on the header button of the cayman theme.
show_downloads: false

# Nothing in this folder but the site itself.
exclude:
  - Gemfile
  - Gemfile.lock
